services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Dev-only mail catcher: SMTP on 1025, inbox UI at http://localhost:8025
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
